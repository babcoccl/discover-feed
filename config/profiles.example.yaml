# Example profiles. Copy to config/profiles.yaml (git-ignored) and edit.
# Any value may reference environment variables: ${VAR} or ${VAR:-default}.
# Never put real API keys in this file.

profiles:
  - id: personal-reader
    name: Personal Reader
    description: Long-form tech, science and culture reading, summarised daily.
    # Web-search enrichment: find other publishers' coverage of single-sourced stories
    # (README "Web-search enrichment"). Off by default; Settings > Pipeline can toggle it.
    enrichment:
      enabled: false
      providers:
        - name: tinyfish            # primary: titles + snippets; key in TINYFISH_API_KEY
          min_interval_seconds: 2   # 30 requests / minute (lower is raised to 2)
        - name: gdelt               # free fallback, no key; tried when tinyfish fails or finds nothing
          min_interval_seconds: 6   # GDELT allows one request per 5 s (lower is raised to 5)
        # More providers are tried when those fail or find too little:
        # - name: guardian
        #   api_key: GUARDIAN_API_KEY  # env var name, never the key
        #   daily_request_budget: 200
        # - name: searxng
        #   base_url: http://searxng:8080
        # - name: brave
        #   api_key: BRAVE_API_KEY  # env var name, never the key
        #   daily_request_budget: 60
      target_sources: 3
      max_added_sources: 3
      wait_seconds: 180
      deny_domains: []
      # Not searched (rarely covered elsewhere); regexes on the headline:
      # skip_title_patterns: ["^Show HN", "^Ask HN", "^Tell HN", "^Opinion", "^Letters"]
      # min_signal_tokens: 2    # skip headlines with fewer distinct names / numbers
    # Topics become feed tabs. Keywords are whole-word and case-insensitive; an empty
    # include list means "every article from the topic's sources".
    topics:
      - name: AI
        include: [AI, artificial intelligence, machine learning, LLM, LLMs, neural network, chatbot]
      - name: Home
        include: [smart home, home, homes, heat pump, thermostat, housing, kitchen, solar panels]
      - name: Travel
        include: [travel, flight, flights, airline, airport, rail, train, hotel, passport]
        exclude: [time travel]
    keywords: [python, open source, space, climate]
    sources:
      - name: Hacker News
        type: rss
        url: https://hnrss.org/frontpage
        refresh_minutes: 30
        tags: [tech]
        # Links to other publishers: citations show the article's domain "via Hacker News".
        aggregator: true
      - name: Ars Technica
        type: rss
        url: https://feeds.arstechnica.com/arstechnica/index
        # refresh_minutes defaults to 30
        tags: [tech, science]
      - name: Quanta Magazine
        type: rss
        url: https://www.quantamagazine.org/feed/
        refresh_minutes: 120
        tags: [science]
      - name: The Verge
        type: rss  # Atom feeds use the same adapter
        url: https://www.theverge.com/rss/index.xml
        tags: [tech]
      - name: TechCrunch
        type: rss
        url: https://techcrunch.com/feed/
        tags: [tech]
    alert_rules:
      - name: Python releases
        include: [python, release]
        match: all
        sources: [Hacker News]
    # LLM roles: `summarizer` writes story summaries, `chat` is for story Q&A (next phase).
    # Any OpenAI-compatible server works; providers differ only in these settings.
    # This profile uses a local llama.cpp llama-server: set LOCAL_LLM_BASE_URL (e.g.
    # http://<lan-host>:8080/v1) and LOCAL_LLM_API_KEY (if started with --api-key) in .env.
    llm:
      summarizer:
        base_url: ${LOCAL_LLM_BASE_URL:-http://localhost:8080/v1}
        api_key: ${LOCAL_LLM_API_KEY:-}
        model: ${LOCAL_LLM_MODEL:-local}
        # Defaults: temperature 0.2, max_tokens 600, timeout_seconds 120,
        # structured_output json_schema (json_object | none), disable_thinking true
        # (sends chat_template_kwargs {"enable_thinking": false}).
      chat:
        base_url: ${LOCAL_LLM_BASE_URL:-http://localhost:8080/v1}
        api_key: ${LOCAL_LLM_API_KEY:-}
        model: ${LOCAL_LLM_MODEL:-local}
        temperature: 0.3

  - id: market-monitor
    name: Market Monitor
    description: Watches markets and macro news, alerting on high-signal events.
    topics:
      - name: Markets
        include: [stocks, S&P 500, Nasdaq, Dow, Treasury, yields, bonds, markets, oil prices]
      - name: SEC filings
        include: [SEC, 10-K, 10-Q, 8-K, filing, filings, enforcement, charges]
      - name: Earnings
        include: [earnings, revenue, guidance, quarterly results, EPS, profit]
        exclude: [earnings call transcript]
      - name: Fed
        # No keywords + a source restriction: everything from the Fed feed.
        sources: [Federal Reserve press releases]
    keywords: [fed, rate cut, inflation, earnings, guidance]
    sources:
      - name: Federal Reserve press releases
        type: rss
        url: https://www.federalreserve.gov/feeds/press_all.xml
        refresh_minutes: 15
        tags: [macro]
        # The publisher is the subject: briefs/reports say "according to the Fed".
        first_party: true
      # sec.gov asks for a contact in the User-Agent: set DISCOVER_CONTACT_EMAIL.
      - name: SEC press releases
        type: rss
        url: https://www.sec.gov/news/pressreleases.rss
        tags: [regulation]
        first_party: true
      - name: CNBC Markets
        type: rss
        url: https://www.cnbc.com/id/20910258/device/rss/rss.html
        refresh_minutes: 10
        tags: [markets]
      - name: Guardian Business
        type: rss
        url: https://www.theguardian.com/uk/business/rss
        tags: [markets]
      - name: BBC Business
        type: rss
        url: https://feeds.bbci.co.uk/news/business/rss.xml
        tags: [markets]
    # Keyword alerts: evaluated on title + feed summary the moment an article is ingested
    # (before extraction, clustering or any LLM work), at most once per story per rule.
    # `$AAPL` is a case-sensitive ticker that also matches "AAPL". See README "Alerts".
    alert_rules:
      - name: Rate decisions
        include: [fomc, rate decision, federal funds rate, rate cut, rate hike]
        sources: [Federal Reserve press releases, CNBC Markets, Guardian Business, BBC Business]
        priority: high
        channels: [phone]
      - name: SEC enforcement
        include: [SEC charges, settlement, enforcement action]
        exclude: [proposed rule]
        channels: [phone, webhook]
        notify_on_update: true
      - name: Big tech tickers
        include: [$AAPL, $NVDA, $MSFT]
        match_in: [title, summary, text]
        channels: [email]
        quiet_hours: {start: "22:00", end: "07:00"}
        max_per_hour: 5
    alerts:
      timezone: ${DISCOVER_TIMEZONE:-UTC}
      public_url: ${DISCOVER_PUBLIC_URL:-http://localhost:8000}
      alert_max_age_hours: 6
      notification_retention_days: 30
      channels:
        # ntfy: https://ntfy.sh (or self-hosted); token only for protected topics.
        - id: phone
          type: ntfy
          server: ${NTFY_SERVER:-https://ntfy.sh}
          topic: ${NTFY_TOPIC:-discover-feed-demo}
          token: ${NTFY_TOKEN}
        # JSON POST signed with HMAC-SHA256 (header X-Discover-Signature: sha256=<hex>).
        - id: webhook
          type: webhook
          url: ${ALERT_WEBHOOK_URL:-http://localhost:8099/webhook}
          secret: ${ALERT_WEBHOOK_SECRET}
        - id: email
          type: email
          host: ${SMTP_HOST:-localhost}
          port: 587
          tls: starttls
          username: ${SMTP_USER}
          password: ${SMTP_PASSWORD}
          sender: ${ALERT_EMAIL_FROM:-alerts@localhost}
          to: ["${ALERT_EMAIL_TO:-me@localhost}"]
    llm:
      # A cloud OpenAI-style provider: same client as llama.cpp, different settings.
      summarizer:
        base_url: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY:-}
        model: gpt-4o-mini
        temperature: 0.0
        timeout_seconds: 60
        disable_thinking: false  # OpenAI rejects llama.cpp's chat_template_kwargs
