# Example profiles. Copy to config/profiles.yaml (git-ignored) and edit.
# Any value may reference environment variables: ${VAR} or ${VAR:-default}.
# Never put real API keys in this file.

profiles:
  - id: personal-reader
    name: Personal Reader
    description: Long-form tech, science and culture reading, summarised daily.
    # Web-search enrichment: find other publishers' coverage of single-sourced stories
    # (README "Web-search enrichment"). Off by default; Settings > Pipeline can toggle it.
    enrichment:
      enabled: false
      providers:
        - name: tinyfish            # primary: titles + snippets; key in TINYFISH_API_KEY
          min_interval_seconds: 2   # 30 requests / minute (lower is raised to 2)
        # Opt-in providers, tried after tinyfish when it fails or finds too little:
        # - name: gdelt              # free, no key. Opt-in: on a live eval it rate-limited
        #   min_interval_seconds: 10 # 32 of 37 requests and found nothing; when tinyfish
        #                          # cools down, stories are retried rather than gdelt
        #                          # falling over the same limit again.
        # - name: guardian           # broad search: many loosely related results for tech
        #   api_key: GUARDIAN_API_KEY  # env var name, never the key
        #   daily_request_budget: 200
        # - name: searxng            # self-hosted metasearch fallback
        #   base_url: http://searxng:8080
        # - name: brave
        #   api_key: BRAVE_API_KEY  # env var name, never the key
        #   daily_request_budget: 60
      target_sources: 3
      max_added_sources: 3
      wait_seconds: 180
      deny_domains:
        # Confirmed content farm (SEO-stuffed articles, paid-backlink placements,
        # Tech-Insider brand mimicry; origin currently hangs). Checked 2026-10-17:
        # superpowerdaily.com and hyper.ai are legitimate publishers — kept.
        - tech-insider.org
      # Similarity thresholds (TF-IDF cosine). Starting points from one live evaluation;
      # tune them with `python -m app.enrich.evaluate` as more live data comes in.
      # min_snippet_similarity: 0.25  # hit title + snippet vs. the headlines
      # min_text_similarity: 0.35     # extracted page text vs. the story's members
      # Combined rule B: a strong snippet can carry a weaker page: accepted when
      # min_snippet_strong + min_shared_entities are met and the text passes min_text_floor.
      # min_snippet_strong: 0.45
      # min_text_floor: 0.25
      # link_only: false          # strong-snippet hits whose page cannot be fetched are
      #                           # stored as "also reported by (link only)" members: shown
      #                           # on the story page, never summarized, cited or counted.
      # Not searched (rarely covered elsewhere); regexes on the headline:
      # skip_title_patterns: ["^Show HN", "^Ask HN", "^Tell HN", "^Opinion", "^Letters"]
      # Or on the anchor article's URL path (opinion columns, live blogs, features —
      # the defaults below; counted as skipped:url_pattern):
      # skip_url_patterns:
      #   [/commentisfree/, /opinion/, /opinions/, /comment/, /columnists/, /blogs/, /live/]
      # min_signal_tokens: 1    # skip headlines with fewer distinct names / numbers
      # Domains blocked before any fetch, as social / aggregator (their own canonical
      # lists still apply; these extend them):
      # social_domains: [threads.net]
      # aggregator_domains: [app.daily.dev]
      # Domains that are the same publisher (regional editions, amp./m. hosts are
      # normalized automatically): used by the same-domain and publisher-count checks.
      # publisher_aliases: {bbc.co.uk: bbc.com, guardian.co.uk: theguardian.com}
      # Extra acceptance rules below min_text_similarity (each recorded in the `via`
      # column). Rule C: many shared entities carry a lower text floor. Rule D: a
      # matching headline plus some entities do too. All other checks still apply.
      # extra_rules:
      #   enabled: true
      #   rule_c_entities: 5
      #   rule_c_text: 0.25
      #   rule_d_title: 0.55
      #   rule_d_entities: 3
      #   rule_d_text: 0.22
    # Background-and-context links: 1-3 pages from OTHER sources that add history /
    # context / data / opposing views — related, never the same event. They are stored
    # with origin=context and shown in a separate "Background and context" section on
    # the story page; they are NEVER sources of the event, never feed briefs/reports/
    # citations/Q&A, and never fire alerts. Off by default; Settings > Pipeline toggles
    # it per profile. Shares the enrichment providers' budgets and cooldowns plus its
    # own daily_request_budget. (README "Background and context links")
    context:
      enabled: false
      providers:
        - name: tinyfish
          min_interval_seconds: 2
        # Optional semantic provider with find_similar() on the anchor URL:
        # - name: exa
        #   api_key: EXA_API_KEY   # env var name, never the key
      # max_angles: 3              # LLM search angles per story (heuristic fallback:
      #                            # top entity + history/explained/background)
      # max_items: 3               # accepted links per story
      # min_words: 300             # fetched page must extract this much real text
      # similarity_floor: 0.10     # below: off topic (reject)
      # similarity_ceiling: 0.60   # at or above: same event / coverage (reject)
      # min_shared_entities: 1     # names/numbers the page must share with the story
      # min_shared_entities_heuristic: 2  # when the angle query was heuristic
      # min_priority: 0            # eligible: priority > this
      # min_publishers: 2          #          OR this many distinct publishers
      # daily_request_budget: 30   # context's own cap on top of shared search budgets
      # llm_judge: true            # summarizer role scores each page 0/1/2 (keep only 2;
      #                            # failures/unparsable reject — notes are never fabricated)
      # language: en               # hit language must match when the provider reports it
    # Topics become feed tabs. Keywords are whole-word and case-insensitive; an empty
    # include list means "every article from the topic's sources".
    topics:
      - name: AI
        include: [AI, artificial intelligence, machine learning, LLM, LLMs, neural network, chatbot]
      - name: Home
        include: [smart home, home, homes, heat pump, thermostat, housing, kitchen, solar panels]
      - name: Travel
        include: [travel, flight, flights, airline, airport, rail, train, hotel, passport]
        exclude: [time travel]
    keywords: [python, open source, space, climate]
    sources:
      - name: Hacker News
        type: rss
        url: https://hnrss.org/frontpage
        refresh_minutes: 30
        tags: [tech]
        # Links to other publishers: citations show the article's domain "via Hacker News".
        aggregator: true
      - name: Ars Technica
        type: rss
        url: https://feeds.arstechnica.com/arstechnica/index
        # refresh_minutes defaults to 30
        tags: [tech, science]
      - name: Quanta Magazine
        type: rss
        url: https://www.quantamagazine.org/feed/
        refresh_minutes: 120
        tags: [science]
      - name: The Verge
        type: rss  # Atom feeds use the same adapter
        url: https://www.theverge.com/rss/index.xml
        tags: [tech]
      - name: TechCrunch
        type: rss
        url: https://techcrunch.com/feed/
        tags: [tech]
    alert_rules:
      - name: Python releases
        include: [python, release]
        match: all
        sources: [Hacker News]
    # LLM roles: `summarizer` writes story summaries, `chat` is for story Q&A (next phase).
    # Any OpenAI-compatible server works; providers differ only in these settings.
    # This profile uses a local llama.cpp llama-server: set LOCAL_LLM_BASE_URL (e.g.
    # http://<lan-host>:8080/v1) and LOCAL_LLM_API_KEY (if started with --api-key) in .env.
    llm:
      summarizer:
        base_url: ${LOCAL_LLM_BASE_URL:-http://localhost:8080/v1}
        api_key: ${LOCAL_LLM_API_KEY:-}
        model: ${LOCAL_LLM_MODEL:-local}
        # Defaults: temperature 0.2, max_tokens 600, timeout_seconds 120,
        # structured_output json_schema (json_object | none), disable_thinking true
        # (sends chat_template_kwargs {"enable_thinking": false}).
      chat:
        base_url: ${LOCAL_LLM_BASE_URL:-http://localhost:8080/v1}
        api_key: ${LOCAL_LLM_API_KEY:-}
        model: ${LOCAL_LLM_MODEL:-local}
        temperature: 0.3

  - id: market-monitor
    name: Market Monitor
    description: Watches markets and macro news, alerting on high-signal events.
    topics:
      - name: Markets
        include: [stocks, S&P 500, Nasdaq, Dow, Treasury, yields, bonds, markets, oil prices]
      - name: SEC filings
        include: [SEC, 10-K, 10-Q, 8-K, filing, filings, enforcement, charges]
      - name: Earnings
        include: [earnings, revenue, guidance, quarterly results, EPS, profit]
        exclude: [earnings call transcript]
      - name: Fed
        # No keywords + a source restriction: everything from the Fed feed.
        sources: [Federal Reserve press releases]
    keywords: [fed, rate cut, inflation, earnings, guidance]
    sources:
      - name: Federal Reserve press releases
        type: rss
        url: https://www.federalreserve.gov/feeds/press_all.xml
        refresh_minutes: 15
        tags: [macro]
        # The publisher is the subject: briefs/reports say "according to the Fed".
        first_party: true
      # sec.gov asks for a contact in the User-Agent: set DISCOVER_CONTACT_EMAIL.
      - name: SEC press releases
        type: rss
        url: https://www.sec.gov/news/pressreleases.rss
        tags: [regulation]
        first_party: true
      - name: CNBC Markets
        type: rss
        url: https://www.cnbc.com/id/20910258/device/rss/rss.html
        refresh_minutes: 10
        tags: [markets]
      - name: Guardian Business
        type: rss
        url: https://www.theguardian.com/uk/business/rss
        tags: [markets]
      - name: BBC Business
        type: rss
        url: https://feeds.bbci.co.uk/news/business/rss.xml
        tags: [markets]
    # Keyword alerts: evaluated on title + feed summary the moment an article is ingested
    # (before extraction, clustering or any LLM work), at most once per story per rule.
    # `$AAPL` is a case-sensitive ticker that also matches "AAPL". See README "Alerts".
    alert_rules:
      - name: Rate decisions
        include: [fomc, rate decision, federal funds rate, rate cut, rate hike]
        sources: [Federal Reserve press releases, CNBC Markets, Guardian Business, BBC Business]
        priority: high
        channels: [phone]
      - name: SEC enforcement
        include: [SEC charges, settlement, enforcement action]
        exclude: [proposed rule]
        channels: [phone, webhook]
        notify_on_update: true
      - name: Big tech tickers
        include: [$AAPL, $NVDA, $MSFT]
        match_in: [title, summary, text]
        channels: [email]
        quiet_hours: {start: "22:00", end: "07:00"}
        max_per_hour: 5
    alerts:
      timezone: ${DISCOVER_TIMEZONE:-UTC}
      public_url: ${DISCOVER_PUBLIC_URL:-http://localhost:8000}
      alert_max_age_hours: 6
      notification_retention_days: 30
      channels:
        # ntfy: https://ntfy.sh (or self-hosted); token only for protected topics.
        - id: phone
          type: ntfy
          server: ${NTFY_SERVER:-https://ntfy.sh}
          topic: ${NTFY_TOPIC:-discover-feed-demo}
          token: ${NTFY_TOKEN}
        # JSON POST signed with HMAC-SHA256 (header X-Discover-Signature: sha256=<hex>).
        - id: webhook
          type: webhook
          url: ${ALERT_WEBHOOK_URL:-http://localhost:8099/webhook}
          secret: ${ALERT_WEBHOOK_SECRET}
        - id: email
          type: email
          host: ${SMTP_HOST:-localhost}
          port: 587
          tls: starttls
          username: ${SMTP_USER}
          password: ${SMTP_PASSWORD}
          sender: ${ALERT_EMAIL_FROM:-alerts@localhost}
          to: ["${ALERT_EMAIL_TO:-me@localhost}"]
    llm:
      # A cloud OpenAI-style provider: same client as llama.cpp, different settings.
      summarizer:
        base_url: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY:-}
        model: gpt-4o-mini
        temperature: 0.0
        timeout_seconds: 60
        disable_thinking: false  # OpenAI rejects llama.cpp's chat_template_kwargs
