# Outlet metadata used by enrichment's deep tier (Coverage section, API fields,
# summarize diversity). One entry per outlet: name, every domain edition, the
# ISO 3166-1 alpha-2 country of its home market and a kind — wire (news
# agency), international (public/global broadcaster), national, local, trade
# (sector press), state (state-run) or blog (born-digital commentary).
#
# `groups` is left empty on purpose: it is for your own labels, then
# `enrichment.depth.ensure_groups` can require coverage from each. Example:
#
#   - name: Associated Press
#     domains: [apnews.com]
#     country: US
#     kind: wire
#     groups: [wire, mainstream]        # your own tags
#
# Unknown domains still resolve: kind = unknown and the country is guessed from
# the TLD (elmundo.es -> ES). Run `python -m app.enrich.evaluate --deep` to see
# the resolved labels per story.

