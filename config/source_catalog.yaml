# Suggested free feeds for Settings > Sources > Catalog (and GET /api/v1/source-catalog).
# Every URL was fetched and parsed as a valid RSS/Atom feed when this file was last updated;
# entries that could not be verified are removed or carry a `note`.
categories:
  - name: Finance & markets
    sources:
      - {name: CNBC Top News, url: "https://www.cnbc.com/id/100003114/device/rss/rss.html", tags: [markets]}
      - {name: CNBC Markets, url: "https://www.cnbc.com/id/20910258/device/rss/rss.html", tags: [markets]}
      - {name: MarketWatch Top Stories, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", tags: [markets]}
      - {name: FT Markets, url: "https://www.ft.com/markets?format=rss", tags: [markets]}
      - {name: Investing.com News, url: "https://www.investing.com/rss/news.rss", tags: [markets]}
  - name: Regulators & central banks
    sources:
      - {name: Federal Reserve press releases, url: "https://www.federalreserve.gov/feeds/press_all.xml", tags: [fed, rates], first_party: true}
      - {name: SEC press releases, url: "https://www.sec.gov/news/pressreleases.rss", tags: [sec], first_party: true}
      - {name: ECB press releases, url: "https://www.ecb.europa.eu/rss/press.html", tags: [ecb, rates], first_party: true}
      - {name: Bank of England news, url: "https://www.bankofengland.co.uk/rss/news", tags: [boe, rates], first_party: true}
      - {name: CFTC press releases, url: "https://www.cftc.gov/RSS/RSSGP/rssgp.xml", tags: [cftc], first_party: true}
  - name: Technology
    sources:
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", tags: [tech]}
      - {name: The Verge, url: "https://www.theverge.com/rss/index.xml", tags: [tech]}
      - {name: TechCrunch, url: "https://techcrunch.com/feed/", tags: [tech, startups]}
      - {name: Hacker News front page, url: "https://hnrss.org/frontpage", tags: [tech], aggregator: true}
      - {name: Wired, url: "https://www.wired.com/feed/rss", tags: [tech]}
      - {name: MIT Technology Review, url: "https://www.technologyreview.com/feed/", tags: [tech, ai]}
  - name: Science
    sources:
      - {name: NASA breaking news, url: "https://www.nasa.gov/news-release/feed/", tags: [space], first_party: true}
      - {name: ScienceDaily, url: "https://www.sciencedaily.com/rss/all.xml", tags: [science]}
      - {name: Nature news, url: "https://www.nature.com/nature.rss", tags: [science]}
      - {name: Phys.org, url: "https://phys.org/rss-feed/", tags: [science]}
      - {name: Quanta Magazine, url: "https://api.quantamagazine.org/feed/", tags: [science]}
  - name: World news
    sources:
      - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", tags: [world]}
      - {name: The Guardian world, url: "https://www.theguardian.com/world/rss", tags: [world]}
      - {name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", tags: [world]}
      - {name: NPR News, url: "https://feeds.npr.org/1001/rss.xml", tags: [world, us]}
      - {name: DW World, url: "https://rss.dw.com/rdf/rss-en-world", tags: [world]}
      - {name: France 24, url: "https://www.france24.com/en/rss", tags: [world]}
