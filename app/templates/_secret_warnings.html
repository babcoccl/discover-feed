{% if secret_warnings %}
<div class="mb-4 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/50 dark:text-amber-200" role="alert" data-secret-warnings>
  <p class="font-medium">Missing secrets — set these in .env (or the container environment) and restart:</p>
  <ul class="mt-1 list-disc pl-5">{% for w in secret_warnings %}<li>{{ w }}</li>{% endfor %}</ul>
</div>
{% endif %}
