# Profiles for the Docker end-to-end run (docker-compose.fake-llm.yml): the example
# profiles with every feed served by the fixture server and every LLM role pointed at
# the fake LLM. Generated from config/profiles.example.yaml.
# summaries: fixture articles have fixed past dates, so backfill covers them all.
profiles:
- id: personal-reader
  name: Personal Reader
  description: Long-form tech, science and culture reading, summarised daily.
  # Web-search enrichment against the fixture server's fake TinyFish (/tinyfish, keyless:
  # the fake needs no key) with its fake GDELT (/gdelt) as the fallback. Fixture articles
  # have fixed past dates, hence the wide age / time-gap windows.
  enrichment:
    enabled: true
    providers:
    - name: tinyfish
      base_url: http://otherwire:8081/tinyfish
      min_interval_seconds: 0.5
      override_min_interval: true  # fake provider is local; the 2s real limit doesn't apply
      timeout_seconds: 3
    - name: gdelt
      base_url: http://otherwire:8081/gdelt
      min_interval_seconds: 5
      timeout_seconds: 3
    max_age_hours: 1000000
    max_time_gap_hours: 1000000
    wait_seconds: 60
    concurrency: 4
    # Deep coverage on every story (one feed publisher already admits it): the fan-out
    # — variants x pages, then the strongest query per location — must land one story
    # on 5+ distinct outlets (each fake answer's hits live on another fixtures alias:
    # tinywire, wirep1, wireus/wiregb/wireau — see app.fixture_server._fanout_base).
    depth:
      enabled: true
      deep_min_publishers: 1
      target_sources: 5
      max_added_sources: 5
      max_queries_per_story: 2
      pages: 2
      locations: [US, GB, AU]
      daily_request_budget: 500
  # Background-and-context finder against the fixture's dedicated /context-search
  # (TinyFish shape) whose hits are generated backgrounder pages on the contextwire
  # host — always a different domain from feed and enrichment (wire) pages.
  # llm_judge off: the fake LLM cannot produce {"adds_context":2} verdicts, so a judge
  # failure would reject every candidate by design (never fabricate).
  context:
    enabled: true
    providers:
    - name: tinyfish
      base_url: http://otherwire:8081/context-search
      min_interval_seconds: 0.5
      override_min_interval: true
      timeout_seconds: 3
    min_publishers: 1
    llm_judge: false
    daily_request_budget: 200
  topics:
  - name: AI
    include:
    - AI
    - artificial intelligence
    - machine learning
    - LLM
    - LLMs
    - neural network
    - chatbot
  - name: Home
    include:
    - smart home
    - home
    - homes
    - heat pump
    - thermostat
    - housing
    - kitchen
    - solar panels
  - name: Travel
    include:
    - travel
    - flight
    - flights
    - airline
    - airport
    - rail
    - train
    - hotel
    - passport
    exclude:
    - time travel
  keywords:
  - python
  - open source
  - space
  - climate
  sources:
  - name: Hacker News
    type: rss
    url: http://fixtures:8081/feeds/hacker-news.xml
    refresh_minutes: 30
    tags:
    - tech
    aggregator: true
  - name: Ars Technica
    type: rss
    url: http://fixtures:8081/feeds/ars-technica.xml
    tags:
    - tech
    - science
  - name: Quanta Magazine
    type: rss
    url: http://fixtures:8081/feeds/quanta-magazine.xml
    refresh_minutes: 120
    tags:
    - science
  - name: The Verge
    type: rss
    url: http://fixtures:8081/feeds/the-verge.xml
    tags:
    - tech
  - name: TechCrunch
    type: rss
    url: http://fixtures:8081/feeds/techcrunch.xml
    tags:
    - tech
  alert_rules:
  - name: Python releases
    include:
    - python
    - release
    match: all
    sources:
    - Hacker News
  llm:
    summarizer:
      base_url: http://fake-llm:8090/v1
      api_key: fake-e2e-key
      model: fake-llm
    chat:
      base_url: http://fake-llm:8090/v1
      api_key: fake-e2e-key
      model: fake-llm
      temperature: 0.3
  summaries:
    summarize_backfill_hours: 100000
    summarize_backfill_max: 1000
- id: market-monitor
  name: Market Monitor
  description: Watches markets and macro news, alerting on high-signal events.
  topics:
  - name: Markets
    include:
    - stocks
    - S&P 500
    - Nasdaq
    - Dow
    - Treasury
    - yields
    - bonds
    - markets
    - oil prices
  - name: SEC filings
    include:
    - SEC
    - 10-K
    - 10-Q
    - 8-K
    - filing
    - filings
    - enforcement
    - charges
  - name: Earnings
    include:
    - earnings
    - revenue
    - guidance
    - quarterly results
    - EPS
    - profit
    exclude:
    - earnings call transcript
  - name: Fed
    sources:
    - Federal Reserve press releases
  keywords:
  - fed
  - rate cut
  - inflation
  - earnings
  - guidance
  sources:
  - name: Federal Reserve press releases
    type: rss
    url: http://fixtures:8081/feeds/federal-reserve-press-releases.xml
    refresh_minutes: 15
    tags:
    - macro
  - name: SEC press releases
    type: rss
    url: http://fixtures:8081/feeds/sec-press-releases.xml
    tags:
    - regulation
  - name: CNBC Markets
    type: rss
    url: http://fixtures:8081/feeds/cnbc-markets.xml
    refresh_minutes: 10
    tags:
    - markets
  - name: Guardian Business
    type: rss
    url: http://fixtures:8081/feeds/guardian-business.xml
    tags:
    - markets
  - name: BBC Business
    type: rss
    url: http://fixtures:8081/feeds/bbc-business.xml
    tags:
    - markets
  alert_rules:
  - name: Rate decisions
    include:
    - fomc
    - rate decision
    - federal funds rate
    match: any
    sources:
    - Federal Reserve press releases
    - CNBC Markets
  - name: Enforcement actions
    include:
    - charges
    - settlement
    - enforcement
    sources:
    - SEC press releases
  llm:
    summarizer:
      base_url: http://fake-llm:8090/v1
      api_key: fake-e2e-key
      model: fake-llm
      temperature: 0.0
      timeout_seconds: 60
      disable_thinking: false
  summaries:
    summarize_backfill_hours: 100000
    summarize_backfill_max: 1000
