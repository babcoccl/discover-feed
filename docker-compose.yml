services:
  app:
    build: .
    image: discover-feed:local
    ports:
      - "8000:8000"
    # Every variable in .env reaches the container (alert/source secrets, auth keys...);
    # the explicit values below are defaults for when .env is missing or leaves them unset.
    env_file:
      - path: .env
        required: false
    environment:
      # Falls back to the example profiles until you create config/profiles.yaml.
      DISCOVER_CONFIG_PATH: ${DISCOVER_CONFIG_PATH:-/app/config/profiles.example.yaml}
      DISCOVER_LOG_LEVEL: ${DISCOVER_LOG_LEVEL:-info}
      DISCOVER_CONTACT_EMAIL: ${DISCOVER_CONTACT_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
    volumes:
      - discover-data:/data
      - ./config:/app/config:ro
    restart: unless-stopped
    # uvicorn gives open streams (SSE) 5 s to finish (--timeout-graceful-shutdown), then exits.
    stop_grace_period: 15s

volumes:
  discover-data:
