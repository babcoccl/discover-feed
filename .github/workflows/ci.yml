name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make install
      - run: make lint
      - run: make test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: demo.cmd smoke test
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
          $p = Start-Process cmd.exe -ArgumentList '/c', 'demo.cmd', '--no-open' -PassThru `
            -RedirectStandardOutput demo.log -RedirectStandardError demo.err
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            try {
              $feed = Invoke-RestMethod 'http://127.0.0.1:8000/api/profiles/personal-reader/feed?limit=100'
              "personal-reader: $($feed.items.Count) articles"
              $ok = $feed.items.Count -ge 15
            } catch { Start-Sleep -Seconds 2 }
          }
          Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Select-Object StatusCode
          taskkill /T /F /PID $p.Id | Out-Null
          Get-Content demo.log, demo.err
          if (-not $ok) { exit 1 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Health check
        run: curl -fsS localhost:8000/health
      - name: Logs
        if: always()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
